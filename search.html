<title>短剧别名检索</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-card: #1c2129;
    --bg-hover: #232a35;
    --border: #30363d;
    --border-soft: #242b33;
    --text: #e6edf3;
    --text-dim: #9198a1;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
    --ai: #d29922;
    --ai-soft: rgba(210, 153, 34, 0.14);
    --danger: #f85149;
    --ok: #3fb950;
    --radius: 10px;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header { padding: 48px 0 24px; text-align: center; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; letter-spacing: .5px;
    color: var(--accent); margin-bottom: 14px;
  }
  .logo svg { width: 22px; height: 22px; }
  h1 {
    font-size: clamp(28px, 5vw, 40px); font-weight: 700;
    letter-spacing: -1px; margin-bottom: 10px;
    background: linear-gradient(135deg, #e6edf3 20%, #8b949e 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 15px; }

  /* Search */
  .search-area { position: sticky; top: 0; z-index: 20; padding: 8px 0 12px; background: linear-gradient(var(--bg) 70%, transparent); }
  .search-box {
    position: relative; display: flex; align-items: center;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 14px; padding: 0 16px;
    transition: border-color .18s, box-shadow .18s;
    box-shadow: var(--shadow);
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box svg { width: 20px; height: 20px; color: var(--text-faint); flex-shrink: 0; }
  #q {
    flex: 1; background: none; border: 0; outline: 0; color: var(--text);
    font-size: 17px; padding: 15px 12px; font-family: inherit;
  }
  #q::placeholder { color: var(--text-faint); }
  .clear-btn {
    display: none; background: none; border: 0; color: var(--text-faint);
    cursor: pointer; font-size: 22px; line-height: 1; padding: 4px 8px;
  }
  .clear-btn:hover { color: var(--text); }
  .kbd {
    font-size: 11px; color: var(--text-faint); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; padding: 14px 2px 8px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .15s; user-select: none;
  }
  .chip:hover { border-color: var(--text-faint); color: var(--text); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .meta-info { color: var(--text-faint); font-size: 13px; }

  /* Cards */
  .results { display: grid; gap: 14px; padding: 8px 0 40px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 18px 20px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--border); transform: translateY(-1px); }
  .card-head { display: flex; align-items: flex-start; gap: 14px; }
  .cover {
    width: 74px; height: 100px; border-radius: 7px; object-fit: cover;
    flex-shrink: 0; background: var(--bg-hover); border: 1px solid var(--border-soft);
  }
  .cover-fallback {
    width: 74px; height: 100px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(145deg, #2a3340, #1c2129);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 26px; border: 1px solid var(--border-soft);
  }
  .card-main { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .title { font-size: 18px; font-weight: 650; color: var(--text); }
  .ai-badge {
    font-size: 11px; font-weight: 600; color: var(--ai);
    background: var(--ai-soft); border: 1px solid rgba(210,153,34,.3);
    padding: 1px 7px; border-radius: 5px;
  }
  .record-no { font-size: 12px; color: var(--text-faint); }
  .intro {
    color: var(--text-dim); font-size: 13.5px; margin: 8px 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .aliases { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .alias {
    font-size: 12px; color: var(--text-dim); background: var(--bg-hover);
    border-radius: 5px; padding: 2px 8px;
  }
  .alias.typo { color: #db61a2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 11.5px; color: var(--accent); background: var(--accent-soft);
    border-radius: 4px; padding: 2px 8px;
  }
  .card-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft);
  }
  .actors { font-size: 12px; color: var(--text-faint); margin-right: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-family: inherit; cursor: pointer;
    padding: 7px 13px; border-radius: 7px; text-decoration: none;
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn svg { width: 13px; height: 13px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); color: #0d1117; }
  .no-link { font-size: 12px; color: var(--text-faint); font-style: italic; }

  /* States */
  .empty { text-align: center; padding: 70px 20px; color: var(--text-dim); }
  .empty .big { font-size: 40px; margin-bottom: 12px; opacity: .5; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .spinner {
    display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Notice banners */
  .banner {
    border-radius: var(--radius); padding: 12px 16px; font-size: 13px;
    margin-bottom: 14px; line-height: 1.6;
  }
  .banner-warn { background: var(--ai-soft); border: 1px solid rgba(210,153,34,.3); color: #e3b341; }
  .banner-info { background: var(--accent-soft); border: 1px solid rgba(88,166,255,.3); color: var(--accent); }
  .banner select, .banner input[type=file] { font-family: inherit; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border-soft); padding: 28px 0 40px;
    color: var(--text-faint); font-size: 12.5px; text-align: center; line-height: 1.9;
  }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 32px 0 18px; }
    .card { padding: 15px; }
    .cover, .cover-fallback { width: 58px; height: 80px; }
    .title { font-size: 16px; }
    .kbd { display: none; }
    .actors { width: 100%; margin-bottom: 2px; }
  }
</style>
</head>

":"2026-11-21"},{"id":"dr_10013","standard_title":"桃花马上请长缨","aliases":[],"record_no":null,"actors":["刘子瑞","马秋元"],"tags":["逆袭","战神","女高手下山","古代言情","宫斗宅斗","权谋","女性成长"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000105459/41000105459.jpg?t=1724166484152&imageView2/0/w/200/h/267","intro":"宋惜惜凭一己之力替战死沙场的父兄护下一城百姓，为了让母亲安心，她跟母亲立誓隐藏军功，不再杀敌为将。并嫁给了母亲给她选的良婿战北望，从此成为内宅女娇娘。新婚当夜，战北望出征，一年来，宋惜惜侍奉公婆，用嫁妆贴补将军府，结果战北望凯旋归来后的第一件事，竟然是逼着宋惜惜承认他用军功求来的婚事，要娶别的女人与宋惜惜平起平坐。宋惜惜见战北望违背永不纳妾的誓言，转身进宫请旨和离。和离后，宋惜惜重新拿起桃花枪，替父亲重振镇北侯府，并且觅得了真正的良婿——北冥王谢如墨。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000105459","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10014","standard_title":"相逢如初见","aliases":[],"record_no":null,"actors":["何健麒","葛晓希"],"tags":["逆袭","豪门恩怨","闪婚","现代言情","总裁","欢喜冤家","甜宠","情感流"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000103116/41000103116.jpg?t=1735720290804&imageView2/0/w/200/h/267","intro":"顾景深和姜十月因为戏精奶奶的强力撮合而闪婚。闪婚后二人各奔东西，对彼此不熟，直到一年后，二人在总裁贴身秘书的选拔会上重逢。至此，姜十月阴差阳错成为顾景深的贴身秘书。尽管白晚晚、顾夫人等人一路从中作梗，破坏二人关系，二人还是在认不出彼此的爆笑日常之中，渐渐滋生情愫。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000103116","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10015","standard_title":"下一站遇见","aliases":[],"record_no":null,"actors":["古铭瀚","宋鸿宇"],"tags":["逆袭","豪门恩怨","闪婚","现代言情","欢喜冤家","甜宠","情感流"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000100936/41000100936.jpg?t=1700549347245&imageView2/0/w/200/h/267","intro":"安乔乔被继母安排相亲，为了教育自恋的相亲男认清自己的相貌，安乔乔顺手抓来一个大帅哥项墨寒，当着相亲男的面亲吻他，虽然气走了相亲男，却让自己陷入了更大的麻烦。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000100936","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10016","standard_title":"九十九封家书震惊全国","aliases":[],"record_no":null,"actors":["邱浩轩","汪天予"],"tags":["家国情仇","励志","都市","强者回归"],"is_ai_drama":false,"cover_url ks":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000100147","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10024","standard_title":"这个皇子不好惹","aliases":[],"record_no":null,"actors":["玖九田","樰倪"],"tags":["穿越","古装"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000100611/41000100611.jpg?t=1701079625730&imageView2/0/w/200/h/267","intro":"一睁眼，他竟穿越成了天景王朝的窝囊皇子！本想混吃等死，奈何内有奸佞当道，外有群狼环伺。既如此，那只好踏着他们的尸骨，独掌江山！","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000100611","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10025","standard_title":"半缘修道半缘君","aliases":[],"record_no":null,"actors":["傅邦奇","李艺璇"],"tags":["虐渣","虐恋","豪门恩怨","现代言情","追妻火葬场","情感流","女性成长","后悔流"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000113082/41000113082.jpg?t=1741159111931&imageView2/0/w/200/h/267","intro":"江莫发现自己和陆修年的婚姻，只是因为陆修年替白月光扫清障碍。一心期盼有个家，却被陆修年暗中避孕导致难以怀孕，江莫彻底心死，毅然决定假死离开，寻找新生活。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000113082","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10026","standard_title":"小花和爷爷","aliases":[],"record_no":null,"actors":["龚和平","郑初晨"],"tags":["逆袭","虐渣","亲情剧","现实","现代言情","家庭","世情"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000105923/41000105923.jpg?t=1725708610096&imageView2/0/w/200/h/267","intro":"赵小花被赵爷爷捡到，吃百家奶长大。心软良善的赵爷爷不顾儿子一家的反对执意收留了赵小花，可心狠毒辣的赵大娘三天两天的殴打辱骂赵小花，在赵小花考上海大后，赵大娘更是拿学费威胁赵小花去上技校，将海大让给自己的女儿赵玥玥去读，六年后，成为总裁的赵小花要衣锦还乡给村民们分股份，谁知众人都以为赵玥玥才是衣锦还乡的总裁，于是纷纷上前巴结，而本就不怀好意的赵玥玥也借此冒领了身份，她不但欺骗了村民，还为了一己私欲虐待赵爷爷，而此刻真正的总裁赵小花已在来的路上。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000105923","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10027","standard_title":"我为自己而活","aliases":[],"record_no":null,"actors":["姜沣","刘清心"],"tags":["逆袭","虐渣","重生","亲情剧","现实","现代言情","家庭","女性成长","后悔流"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000106070/41000106070.jpg?t=1735714844546&imageView2/0/w/200/h/267","intro":"杨梅为了女儿乔亚楠牺牲一切，但在乔亚楠功成名就的记者发布会上，被乔亚楠网暴晕倒，同时，乔亚楠拒绝在手术书上签字，最终死亡，杨梅带着悔恨重生回到十年前。杨梅决定不再管女儿，与女儿乔亚楠断绝关系，也和重男轻女只会吸食她血肉的原生家庭断绝来往。开始追求自己年轻时的梦想，努力学习考大学，通过自己的努力和前一世的认知，成功复读成功考上国内顶尖学府清北大学，同时，通过上一世的记忆投资各个风口行业，短时间内便登上国内富豪榜前列，成为风云人物。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000106070","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10028","standard_title":"老无所依","aliases":[],"record_no":null,"actors":["王彬","王姝懿"],"tags":["复仇","亲情","战神","家庭","都市","强者回归"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000105462/41000105462.jpg?t=1724207788322&imageView2/0/w/200/h/267","intro":"林爱国，这位曾是大夏镇国重臣的龙帅，他默默无闻，舍弃了辉煌的身份，历经千辛万苦，独自拉扯大了两个儿子林平和林安。岁月不饶人，步入晚年的他不幸患上了老年痴呆，本应享受天伦之乐的他，却遭遇了儿子与儿媳的冷漠与虐待。就在这危急关头，一直忠诚于他的青龙使得知龙帅流落江城，立刻赶来，誓要寻回并保护这位昔日的英雄。随后，一场盛大的腾龙宴即将召开......","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000105462","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10029","standard_title":"无极归来","aliases":[],"record_no":null,"actors":["王鹏","程美华"],"tags":["复仇","长生","无敌","都市","强者回归"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000102581/41000102581.jpg?t=1709622679308&imageView2/0/w/200/h/267","intro":"无极门乃人间第一势力，其掌权人是无极神尊江阳。江阳因六十年一轮回，记忆心智暂被封印，流落清州，被云家大小姐云书梦所救，两人结为夫妻。清州富豪方昊杰有意霸占云书梦，派人对江阳动手，却意外使江阳恢复神志。无极神尊归来，曾经跟在江阳手下的几位弟子如今都已成为各方的顶级势力，计划举办无极大会迎接江阳回归。江阳凭借自身的高强功力，接连打败一众反派，解救出被逼迫的云书梦，并在无极大会上向众人公布身份，和云书梦继续幸福生活。","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000102581","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10030","standard_title":"逆苍天","aliases":[],"record_no":null,"actors":["张子寒","孟娜"],"tags":["复仇","战神","情感","都市","强者回归"],"is_ai_drama":false,"cover_url":"https://seoali.zqkanshu.com/cppartner/4x1/41x0/410x0/41000100712/41000100712.jpg?t=1735698897637&imageView2/0/w/200/h/267","intro":"入狱三年，他忍辱负重，成就北安王之名！以无敌之姿，笑傲寰宇！","platform_links":[{"platform":"河马短剧","h5_url":"https://www.kuaikaw.cn/drama/41000100712","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10031","standard_title":"万妖图录传第一季","aliases":["万妖图录传","万妖图录传1"],"record_no":null,"actors":[],"tags":["全81集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/d276704b9a05ee371eb1a1c0e42ca581~tplv-shrink:640:0.image","intro":"以妖血为墨、百妖谱为卷，可摹其形、夺其神通。姜月初穿越成大唐少女，觉醒万妖图录系统，借道行反杀鸣骨虎妖、将虎山神录入妖谱，斩妖得道行。她斩青面狼妖、练成妖化神通，更一拳击穿屠戮金城的鸣骨大妖朱厌，被镇魔司破格收编。此后妖化劈杀痴守沉塘杏儿的鲶鱼精、月圆夜强破鸣骨境，又斩假扮高僧食人的黑熊精，升任先锋营校尉奉调玉门关。可边关大妖，竟是自号平天真君的白猿——殿上真君，正为一头失踪的小虎妖动了杀念！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7621200213801176126","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10032","standard_title":"万妖图录传第二季","aliases":["万妖图录传","万妖图录传2"],"record_no":null,"actors":[],"tags":["全53集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/46689889a06d34aa70aa1a876d429553~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，成了盛世大唐的一介少女，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。父亲被问斩在即，仇家柳家却藏着燃灯境老怪物，姜月初立誓在行刑前杀回长安救父。玉门关前，她当众扇碎奸细伪装、关门不留活口，以伤换伤死战白猿公，凭一己之力斩杀平天真君，更硬撼白蛟、夺来控水神通。道行疯狂暴涨，她能否赶在刑期前救回父亲？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7628202881140657177","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10033","standard_title":"聚宝仙盆之杂灵根才是真BOSS第二季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS2"],"record_no":null,"actors":[],"tags":["全111集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/889a9cc8ce7891a00f45697ef605b5ee~tplv-shrink:640:0.image","intro":"贺平生做杂役时捡破盆，发现其复制强化力。借此强化药材、功法、法器等，继父母之仇得报、所在宗门因内讧覆灭之后，他逃亡至定襄城，偶遇本早已离世的故人王敦，后因意外卷入皇室追查“大气运者”事件，遭全国搜捕。在神将山秘境中，他展现惊人悟性与气运，获得枪意结晶并取走神枪，彻底激怒皇室。为助他逃生，其道侣乔慧珠毅然散功毁容，二人历经艰险最终逃往梁国。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7629943873896188990","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10034","standard_title":"万妖图录传第三季","aliases":["万妖图录传","万妖图录传3"],"record_no":null,"actors":[],"tags":["全58集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/6fcd8cc23692a3fb0de181eb1b5eb284~tplv-shrink:640:0.image","intro":"以妖魔之血为墨、百妖谱为卷，少女姜月初穿入妖魔横行的大唐，斩妖入谱便可夺其神通、增其道行。在凉州，她识破忘尘的迷药杀局，硬撼四谛金身，格杀成丹境邪僧，奉敕暂代陇右指挥使。赴羌江追查白蛟，镇守郎将关游龙悍然拦阻，她联手巡察使顾长歌将其锁拿，审出他为求寿元，竟月以百姓喂妖。江底恶战，她刀斩羌江龙王，夺下龙珠，道行大涨，她破入成丹后境。宝刹寺旧账未清，她按捺杀心，只待点墨境成，重上山门。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7633436713011907608","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10035","standard_title":"聚宝仙盆之杂灵根才是真BOSS第三季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS3"],"record_no":null,"actors":[],"tags":["全119集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/c0fd5d2ee63358d06421b7d30f39a64a~tplv-shrink:640:0.image","intro":"妻子乔慧珠渡八九天劫后道根将碎，贺平生为寻玄黄黑白藕孤身踏入五龙沟秘境。从秘境夺宝到九国大比，九国大比中，他横扫齐国，声名鹊起，因师门被齐国囚禁，他潜入皇都绑架皇子，逼齐皇放人，一路上遇见了苏真真、梁画秋等人，是陷阱，还是机缘，贺平生不得而知，只能恪守道心，养精蓄锐。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7637096540321893400","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10036","standard_title":"万妖图录传第四季","aliases":["万妖图录传","万妖图录传4"],"record_no":null,"actors":[],"tags":["全69集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/a2af210ab4f8423941711da3c7a226f2~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，成了盛世大唐的一介少女，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。她召唤四大妖王联袂屠寺；槐树村孩童集体失踪，她查出村民竟献祭孩童喂树换粮，怒斩树妖，夺下两千八百余年道行；西北干旱，她舍弃白蛟控水术，将千年道行尽注给擅山石术的白猿公；入长安镇魔总司报到，与旧识顾长歌并肩截杀羊妖群；入武庙感应灵印，识海苦战后灵力淬体；六千年妖王闻她斩白蛟，杀机暗起。姜月初的斩妖之路将通向何方？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7637517119122312254","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10037","standard_title":"归墟第一季","aliases":["归墟","归墟1"],"record_no":null,"actors":[],"tags":["全12集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/bedb12ff5b3716312f3b27b54d0c81cb~tplv-shrink:640:0.image","intro":"这是一部关于新物种诞生与末世灾难降临的原创长篇故事。一场异常黑雨之后，城市地下开始出现无法解释的生命变化。最初只是零星的失踪与异响，随后，巨型蚂蚁撕开地下空间的入口，隐藏在黑暗中的新生态逐渐显露。昆虫、鱼类与更多生物被未知力量改写，体型、习性与生存方式不断进化，原本熟悉的城市开始变成陌生的猎场。随着变异生物持续扩散，人类原有的生活秩序被迫改变。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7638987534483082265","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10038","standard_title":"万妖图录传第五季","aliases":["万妖图录传","万妖图录传5"],"record_no":null,"actors":[],"tags":["全64集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/70de07276dc75022a80cbd5a2c4bdc03~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，成了盛世大唐的一介少女，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。姜月初连跨两级晋升银袍巡察使带队南下，丹阳城被大妖逼入绝境，她出马不足半个时辰便取敌首级。白露江底潜着背景深厚的黑蛟，她拔刀入水强杀恶蛟，将其摹入万妖图录，得了长在腹中的储物空间。太湖妖气蔽日，妖王欲袭横山渡，姜月初散尽一千三百年道行，从雪山之巅纵身一击。这一刀，是生是死？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7642602521285889048","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10039","standard_title":"聚宝仙盆之杂灵根才是真BOSS第四季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS4"],"record_no":null,"actors":[],"tags":["全119集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/37ccd9548f5a7ea3907e5fc2c9370fcd~tplv-shrink:640:0.image","intro":"圣主他以悟道为名囚禁乔慧珠等人，贺平生潜入圣山发现其窃取气运延寿的秘密，与王敦联手集结天下化神斩杀二圣，取回时空本源，复活乔慧珠，修复飞升通道后被空间之力裹挟进入灵界，可世事难料，飞升失败，贺平生重伤坠落灵界胭脂山，被采药女李芸芸所救。一路发育一路苟，终于进入新大陆，起手救人却反遭恩将仇报、被追杀，无奈贺平生只能假死脱身。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7642925668568665150","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10040","standard_title":"万妖图录传第六季","aliases":["万妖图录传","万妖图录传6"],"record_no":null,"actors":[],"tags":["全90集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/51a0e8330198ac5de8b439b7ca419fc0~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，成了盛世大唐的一介少女，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。一枚青鸟龙纹佩，坐实了养父姜洵的罪名，姜月初为求真相踏入镇魔司，却惊闻当年宫乱中明妃惨死，公主下落不明。柳太后暗施阴谋指她为妖，天眼神术还她清白；身世揭晓，她竟是失踪多年的昭月长公主。坐镇陇右，她镇压青白双龙、修成化龙经；金翅大鹏欲血洗凉州，反被她收入图录。除夕夜贺岁，她立志登观山、燃灯、绝顶之境。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7645616042022014014","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10041","standard_title":"凡人百世书第二季","aliases":["凡人百世书","凡人百世书2"],"record_no":null,"actors":[],"tags":["全94集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/bd72c00b9b8f05303a1c89346bf2cef4~tplv-shrink:640:0.image","intro":"陈默意外获得百世轮回系统，每世死后可保留意识并提升资质。第一世他退隐经商却遭坏人吴天德杀害，第二世化名林默潜入紫衣门蛰伏十年，努力提升修为，最终让坏人吴天德得到应用的惩罚，虽因紫衣门先天老怪功亏一篑，却为后续轮回积累了经验与资本，始终在成长的道路上负重前行。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7648190446828538904","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10042","standard_title":"谁说没灵根不能修仙的之无灵证道第二季","aliases":["谁说没灵根不能修仙的之无灵证道","谁说没灵根不能修仙的之无灵证道2"],"record_no":null,"actors":[],"tags":["全94集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/c4306917813ae68f22b5a28fd4427be5~tplv-shrink:640:0.image","intro":"蛮荒界灵根为尊，无灵根者，终生与仙道无缘的世界。韩凡，琉璃剑宗最底层的杂役，无灵根，无背景，连一顿饱饭都成奢望，本以为此生只能在泥泞中苟活，却在一次上山伐竹时，意外捡到一柄锈迹斑斑的残剑浮仙。自此，他的人生彻底改写。挥剑砍竹，灵气入体，挥剑斩石，肉身淬强，挥剑对敌，修为暴涨！你有天灵根，修炼一日千里？不好意思，砍你一剑，我的修为涨得比你还快。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7649221760872631321","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10043","standard_title":"谁让这个悍匪修仙的第二季","aliases":["谁让这个悍匪修仙的","谁让这个悍匪修仙的2"],"record_no":null,"actors":[],"tags":["全71集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/f6f1a44a41eef43fc2f6eb8c07f2b1c0~tplv-shrink:640:0.image","intro":"身负武脉的山匪纯小白再入修仙界，凭超强肉身与机智手段，伪装天煞谷首领\"大王\"，驾驭战傀横行秘境，收服萧章为四当家，搭建黑风寨势力网络。随后绑架各宗核心人物索要巨额赎金敛财，又在神秘红衣女南宫帝主撺掇下，将天煞谷与千宗联盟搅得大战将起。他敲诈青云宗长老、混入内门苦修，突破筑藏境时竟引来灭世天罚，宗主慕倾澜亲自替他遮掩。雷坑之下秘殿现世，他与慕宗主正面交锋，这一次还能否全身而退？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7649333076358597656","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10044","standard_title":"万妖图录传第七季","aliases":["万妖图录传","万妖图录传7"],"record_no":null,"actors":[],"tags":["全90集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/e241529553db044d89340e5591a25132~tplv-shrink:640:0.image","intro":"在妖魔横行的大唐，少女姜月初一路斩妖夺取神通，真身却是昭月长公主。晦月妖圣驱众妖祸乱江南西道，姜月初亲赴前线。她先斩鬼金妖王，又诛杀银骨妖尊冷烟兔，夺得银骨琉璃身。她悟透内景阴阳之法，融大荒四凶铸就荒神躯，立下阴阳同修之志。鄱阳再斩赤鳞妖尊后，她驰援庐陵，连诛四位观山妖尊，更倾尽道行接连熄灭燃灯妖圣的心灯。凯旋之日皇帝亲迎，而先皇夺舍暗谋与灵山复仇之怒正同时逼近。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7651944586545220633","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10045","standard_title":"黑虎","aliases":[],"record_no":null,"actors":[],"tags":["全20集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/cdb197dee0fa17e80e34c1c1e981d963~tplv-shrink:640:0.image","intro":"九岁女孩小月父母双亡，独自住在深山老屋，与她相依为命的是大狗黑虎——一只威猛的蒙古獒“铁包金”。黑虎每天为小月找吃的，叼着烧鸡、大鱼、山鸡去集市换食物，还帮摊主递毛巾、给小女孩叼来新棉袄。一天小月被抓走，黑虎闻着气味一路狂奔，面对坏人，它发出震天怒吼，誓要救回小主人，这是一个关于忠诚、勇气与守护的温情故事。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7652581623984032793","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10046","standard_title":"聚宝仙盆之杂灵根才是真BOSS第五季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS5"],"record_no":null,"actors":[],"tags":["全128集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/ca0cc70207abf13f39ede5f24bf992da~tplv-shrink:640:0.image","intro":"杂役弟子贺平生飞升灵界遭遇炼虚袭击后重生，被迫改头换面、隐姓埋名，在弱肉强食的灵界挣扎求生。他孤身闯进九重帝宫，一路低调崛起、收服强敌，他又被卷入万年难逢的天骄盛会，在亦真亦幻的红尘梦里，他体验了一世凡人人生。可繁华散尽，真正的杀机才刚刚降临孤身直面凤族铺天盖地的围剿，这只被人轻视的“蝼蚁”，又将如何脱险。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7653639205888724030","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10047","standard_ 仙凡桎梏在前，她能否一枪破局？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7660437812851788862","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10054","standard_title":"魏家逆子成首辅第三季翰林篇","aliases":["魏家逆子成首辅翰林篇","魏家逆子成首辅翰林篇3"],"record_no":null,"actors":[],"tags":["全65集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/b9df106d6c441e402851304b2e0c2f19~tplv-shrink:640:0.image","intro":"偏院弃子魏逆生受尽家族冷眼，隐忍十年拜三朝老臣冯衍为师。为报先祖灵位被毁之仇，他斩杀宁王世子姜钰，被押往太和殿接受圣裁。宁王姜彰悲愤控诉，皇帝姜琰却借此痛斥其丧师辱国、舍弃三州百姓的重罪。身负冯党最后的希冀与重振魏家门楣的重担，魏逆生踏上科举之路。省元之争、望春楼舌辩众人，他凭旷世才学打破特权非议。殿试挥毫献策，畅谈举贤安民、安抚四方，被钦点一甲头名状元。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7661473744812002328","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10055","standard_title":"山海藏墟无眼窥天第二季","aliases":["山海藏墟无眼窥天","山海藏墟无眼窥天2"],"record_no":null,"actors":[],"tags":["全110集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/1e21487727eb2505f671e39b88e35946~tplv-shrink:640:0.image","intro":"盲眼少年李观棋幼年时饱经磨难，被神秘老者苏玄收养，授功法、锻体魄、赠剑匣。十四岁入大夏剑宗，觉醒圣品雷系灵根，修炼速度冠绝同辈。剑匣中藏着一个高傲的剑灵，暗中指导他修行。入宗后，李观棋闯秘境、领队迎敌，一路崛起，自成大道。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7661912884594625560","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10056","standard_title":"农村兽神","aliases":[],"record_no":null,"actors":[],"tags":["全97集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/3da4faf50a876559af610af2302fb8d8~tplv-shrink:640:0.image","intro":"1984年，石林重生回到退婚现场。前世因执着于林晓霞，导致家破人亡；今生他果断退婚，并意外觉醒“兽仆系统”。通过捕捉动物获得兽仆点，石林先后契约了马蜂（共享视野）、紫貂（速度共享）、驼鹿（力量共享）和土鲶鱼（水下感知）。凭借系统与前世的见识，石林在大兴山中开启了疯狂的降维打击，带着全家过上了顿顿有肉吃的好日子！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7662351990944451608","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10057","standard_title":"万妖图录传第九季","aliases":["万妖图录传","万妖图录传9"],"record_no 重生记睁眼后盖房发家2"],"record_no":null,"actors":[],"tags":["全145集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/7abd2f4ccae51e883644395e86b452c8~tplv-shrink:640:0.image","intro":"建筑设计师李穗儿穿成猪圈傻女；这一季的她，不再是当初那个任人欺负的“傻姑”。救玉华，斗娟子，旧仇人们，眼看李穗儿越过越好，坏点子频出！李穗儿该如何反击？好闺蜜玉华被娘家欺负，神秘莫测的钱老板，躲在暗处使坏的娟子，程风出狱，金夫人？虽然前路未知，但李穗儿会在这个陌生的时代闯出属于自己的新天地。她不靠天不信命，只靠自己的双手，只为自己而活。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7667111184377580569","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10065","standard_title":"山河独酌第二季","aliases":["山河独酌","山河独酌2"],"record_no":null,"actors":[],"tags":["全135集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/f1f5c7a692a9183162b67df331777fe8~tplv-shrink:640:0.image","intro":"众人皆道李四是个潦倒落魄的疯乞丐，终日混迹街头，靠残酒度日，人人都觉得他时日无多。唯有酒馆的徐娘子心地善良，时常接济他吃食，雨天为他遮风挡雨，在他重伤濒死之际将他收留照料。后来酒馆生意日渐萧条，难以维系，安稳日子眼看就要撑不下去。往日任凭旁人议论也不吭声的他，缓缓提笔写下一纸方子，竟让酒馆起死回生，客似云来。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7667887337333853246","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10066","standard_title":"道印入体得到道家传承后我终于发达了4","aliases":[],"record_no":null,"actors":[],"tags":["全128集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/0acc63b082e09f0a90dad003394a81e7~tplv-shrink:640:0.image","intro":"孤儿陈昊宇自幼随道长出家，不料一场车祸令他激活了祖传宝珠，觉醒了逍遥真人的传承，通晓玄门医术与相术。他经营诊所，以玄门医术、符箓术法破解各类疑难怪症与诡异案件。他处理复仇伤人案，用清心符救治抑郁症患者，周旋嫌疑人，协助追查凶案线索，同时寻回亲生父母，解开身世心结，与医生苏雨瑶互生情愫……","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7668264608074845246","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10067","standard_title":"魏家逆子成首辅第五季党争篇","aliases":["魏家逆子成首辅党争篇","魏家逆子成首辅党争篇5"],"record_no":null,"actors":[],"tags":["全115集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/9fa89907d8e0665f12477f6d4d1227e2~tplv-shrink:640:0.image","intro":"社科院精英魏逆生穿越成大周魏家灾星孽子，三元及第入翰林。他修史揭出南京常平仓四万七千石粮亏空黑幕，以身入局引爆朝堂党争。遭首辅沈端反扑、亲历挚友死谏后，他认清清流软弱与官场残酷，在恩师点拨下摒弃理想主义，笃定掌权守公理的信念。借皇帝制衡之术，魏逆生以钦差身份南下苏州清查赋税，携好友布防周旋各方势力，从修史书生蜕变为权谋执笔者，踏上首辅夺权之路。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7668298637113297944","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10068","standard_title":"一梦青玄团宠小师妹一剑毁天灭地第二季","aliases":["一梦青玄团宠小师妹一剑毁天灭地","一梦青玄团宠小师妹一剑毁天灭地2"],"record_no":null,"actors":[],"tags":["全200集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/065a6bfc66aa7d3c3e7062576e8757b8~tplv-shrink:640:0.image","intro":"叶灵泷穿书成恶毒炮灰女配，凭符阵天赋当稳青玄宗团宠小师妹。她伪装成鲛族公主号令群妖，集齐苍水珠碎片，硬生生斩杀化神大妖山海，撕碎封州死局。大师兄裴洛白背负白羽陵灭门血案，血洗丹心堂后遭全修仙界围杀，她空降石泽谷以命相护，又潜入神医谷翻出十年前冤案。“天降福岛”现世，她带队狩猎夺宝、降服龙龟妖，催师兄冲击化神，势要改写师门结局。而窃运谋命的叶溶月仍藏身岛中，她与叶灵泷的生死决战何时了断？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7668601719177088025","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10069","standard_title":"谁让这个文盲修仙的","aliases":[],"record_no":null,"actors":[],"tags":["全144集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/84006653f9eec2c075dd3f5ffe7e0a33~tplv-shrink:640:0.image","intro":"穿越者陈极流落玄天大陆，因目不识丁，以三枚包子换来《浩然正气诀》，看图逆修功法，正道浩然气转为魔气，遭到浩然宗追杀。逃亡时巧遇隐世的浩然老祖，得令牌与化龙功法。他持令牌入宗门被尊为圣子，图解自创掌法战胜首席剑修林琅天，揭穿洛青阴谋。二人携手参与苍山大比，与众天骄交锋，秘境合力迎战强敌，夺得通天建木树心，最终五人一同踏入青铜石门，奔赴上苍之上寻求机缘。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7668904735717477400","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10070","standard_title":"万妖图录传第十季","aliases":["万妖图录传","万妖图录传10"],"record_no":null,"actors":[],"tags":["全116集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/67a5138d71e61d2088c975c3933f9250~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，来到盛世大唐，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。大唐风云骤紧：姜月初先镇虎皇，后力压赤霄，借大妖元神直入登楼六重，为护大唐揽下丹鼎宗数千人死仇。灵山妖皇暗中联手图谋真龙，各大道统纷纷入局，大唐四面楚歌。她孤身迎战十余位登楼仙人，师尊无十三不惜得罪二十五脉为她撑腰，一战杀得满城修士噤若寒蝉。此后她留印金身、演化九种金身法门，被苍生奉为再世真君，终以大道赐法万民。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7669384046295649342","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10071","standard_title":"烛九阴第三季","aliases":["烛九阴","烛九阴3"],"record_no":null,"actors":[],"tags":["全108集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/ec15f7aa9c0962c518b0cdf0f314c080~tplv-shrink:640:0.image","intro":"义母离世后，苍雪带着苍雨与戏箱踏上逃亡路，却在乱世龙城遭遇更深的风雪。一路生离死别，一句“好好活着”，成了她走向太行的最后牵引。她拜朱九阴为师，在周山学拳练剑、直面心魔，也一步步把苦难磨成刀锋。与此同时，洛星河与招摇山的阴影悄然逼近，一场以苍雪为饵、牵动天道与古神的杀局，正在风雪中缓缓展开。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7669744336673721369","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10072","standard_title":"聚宝仙盆之杂灵根才是真BOSS第八季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS8"],"record_no":null,"actors":[],"tags":["全138集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/aada0e072b978e24886701518f95d83a~tplv-shrink:640:0.image","intro":"贺平生凭聚宝盆复制灵物、炼丹制符，在灵界崛起。他持金苦令入仙墟争十大真毒，为受压的灵界人族争根基，却被凤族龙族联手封死墟中三百余年；绝境里他反制夺舍的金苦老祖，修成九毒炼金身与时间神通，晋大乘后破墟而归，却见孤松山被踏平、至亲困于小世界。他怒破护山大阵，覆灭凤族，登顶首位人族帝君，重定五族秩序，更闯黄泉抢回周青眉残魂。甲子天盲将临，聚宝盆骤然失灵，新的危机已然逼近。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7671115782083841048","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10073","standard_title":"凡人百世书第五季","aliases":["凡人百世书","凡人百世书5"],"record_no":null,"actors":[],"tags":["全109集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/998e19c31b5e6ee12dac96ce599128c5~tplv-shrink:640:0.image","intro":"百世轮回的陈默倾尽积分开启第十二世，投生郑家，成了满堂期盼的麒麟儿郑耀祖。未料边关陷落，亲大伯郑铁山通敌妖族，反栽赃其父郑铁源，害得父亲蒙冤惨死，母子遭满门追杀。二十年后，陈默隐居在青石城，凭惊世炼器天赋开坊立业，以流水线炼器和法宝霹雳子横扫妖军。郑家寿宴上，他当众亮明真身，铁证揭开百年冤案，为父平反；随后化身狐族潜入众邪之城追索炼妖炉，九死一生。风雪尽头，他还能平安回到母亲身边吗？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7671578095769357337","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10074","standard_title":"持械入宋第一季","aliases":["持械入宋","持械入宋1"],"record_no":null,"actors":[],"tags":["全100集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/3edbd9c6ab15ebff3fd0853ec74a4f27~tplv-shrink:640:0.image","intro":"宋末年，烽火连天。一支执行任务的现代五人小队，意外坠入时空隧道，全员携械穿越到大宋。队长林昭京片子冷静果决，统帅全局。狙击手谢长风、军械师马振邦-一口东北大碴子，战力拉满。通信兵王浩川-广东仔，情报组网，眼观六路。湘妹子医官陈素--妙手回春，战地玫瑰。以现代人的视角看大宋，这将是一场现代与古代的文化冲突，将是一场科技的降维碾压。大宋注定将不再平凡。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7671966197985856536","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10075","standard_title":"暴富山城故事2","aliases":[],"record_no":null,"actors":[],"tags":["全81集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/6fc475b3dde5e94ea41967ae9e0dda0e~tplv-shrink:640:0.image","intro":"凭借一张彩票一夜暴富的韩强，偶遇了中学时代的白月光董淑琴，在同学聚会的当晚，他与董淑琴分别，两人约定冬季再见，失落的董淑琴准备第二天返回大都市继续打拼，而韩强则将对董淑琴的情感压在心底，独自驱车赶回乌西老家，这一刻，他决定自己的人生要换个活法、为自己的人生翻开新的篇章，只是他自己也不敢确信，自己与董淑琴究竟有没有未来。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7672062039828745240","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10076","standard_title":"重生七零东北悔婚后我打猎致富乡野","aliases":[],"record_no":null,"actors":[],"tags":["全90集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/aa19bb0770d61c4bb7d1b0abf6942d5e~tplv-shrink:640:0.image","intro":"李青山重生回到知青下乡年代，主动接纳处境艰难的苏暮鱼成婚。他依靠过人的狩猎天赋进山获取山货，采得百年野参换来积蓄，勤恳务农经营小家，善待双方家人，用心呵护妻子，一家人相互扶持，安稳富足地度过乡村生活，日子稳步向好。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7672323375351467033","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10077","standard_title":"谁说纨绔不能当状元","aliases":[],"record_no":null,"actors":[],"tags":["全788集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/11cc0d4546645a32992f76061c0bc3a7~tplv-shrink:640:0.image","intro":"一个花钱买来的状元，竟被皇帝亲自召进朝堂。江小白本想继续当他的纨绔世子，却发现兄长之死疑点重重，侯府早已身陷局中。诗会争锋、殿前互试、权臣博弈、皇室暗局接踵而来。所有人都以为他只是个没脑子的败家子，却不知道，这个最不起眼的纨绔，正在悄悄看穿整盘棋局。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7673067074104593432","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10078","standard_title":"道印入体得到道家传承后我终于发达了7","aliases":[],"record_no":null,"actors":[],"tags":["全141集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/ad4d39de146e0199c545840da4d8b808~tplv-shrink:640:0.image","intro":"我本以为修炼道印只是改变命运的开始，却没想到它让我一步步站上巅峰！面对东瀛高手挑衅，我凭借道家传承强势破局，击败草川佑树等强敌，揭开背后的阴谋。随后，我掌控东方集团，反击那些曾经轻视我的人，让他们见识真正的实力。从无人看好到掌控商业帝国，我终于明白，命运从不会眷顾弱者，只有自己强大，才能赢得所有尊重！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7673107280929229848","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10079","standard_title":"聚宝仙盆之杂灵根才是真BOSS第九季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS9"],"record_no":null,"actors":[],"tags":["全99集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/9fd31c97f6a53b670e6024068c3250d5~tplv-shrink:640:0.image","intro":"贺平生在灵界巅峰布下气运大阵，闯缥缈山斩三尊散仙，又开通界大阵与亲人团圆，硬扛轮回拉扯，以九九气运和都天真雷复活周青眉。飞升关头，他拒绝斩去五具分身，独扛六倍九九寂灭劫雷，靠聚宝盆接下第九道天雷，踏彩虹天道进入仙界。落入红莲仙谷后，他从底层起步，易容藏锋，反杀设局的归德、青玄及截杀他的地仙，击退昆吾山强敌。兽潮与新仇接踵而至，还要借升仙碑、感应仙符寻回失散亲友。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7673807696302197784","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10080","standard_title":"万妖图录传第十一季","aliases":["万妖图录传"],"record_no":null,"actors":[],"tags":["全164集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/d64412cef9caca52e6a65d55857ae958~tplv-shrink:640:0.image","intro":"姜月初一朝醒来，成了盛世大唐的一介少女，斩杀妖魔便能增长道行并绘入妖谱，化作自身力量。她镇守长安，布下金身护持人间；为救同伴闯灵山、踏平青鸾山；远赴东域化真龙杀上无相山，连诛千羽、赤血等妖皇，硬撼执棋仙君，亲手击杀东域第一天骄。修行至登楼境圆满时，她惊觉自己竟是玄阳真君等画境大能掌中的棋子，却不认天命，誓要斩碎樊笼，与幕后布局者一较高下。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7673810791547538494","scheme":null,"valid":tru tro":"武师踏骨而行，方士驭气而生，这大夏天下，谁配端坐庙堂？赏金客以命换钱，妖兽在荒野嘶吼，这混沌江湖，谁能执掌沉浮？高高在上的皇室暗布削藩局，盗走顾家真嫡子，以假公子冒名顶替，把襁褓中的他丢进血火地狱，笑看棋子自相残杀。十七年后，死人堆里爬出个少年，化名顾十一，破衣烂衫，六指握刀。杀宋家开道，借陆家入局，从江湖一路杀回庙堂。苍天有命我来改，皇室有棋我来掀！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7675932141238111256","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10092","standard_title":"我有六个黄毛爹","aliases":[],"record_no":null,"actors":[],"tags":["全72集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/79052ce0bcb6e61b7a71bb574994be35~tplv-shrink:640:0.image","intro":"被豪门寻回的真千金沈夏夏，刚回到沈家就遇上假千金设计的圈套，被扣上偷窃耳环的嫌疑，无奈被亲生父母逐出家门，落魄流落街头。幸运的是，几位热心的城中村青年向她伸出援手，愿意资助她求学成长。沈夏夏刻苦发奋，凭借不懈努力考出689分的优异成绩，顺利考入理想名校。升学宴当日，她以服务人员的身份再度与沈家相遇，面对又一次的误会嫁祸，她调取监控，拿出录取通知书自证清白，揭开假千金编织的谎言。后续她拿到补偿款","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7676072855259319358","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10093","standard_title":"大乾毒士千古第三阳谋第二季","aliases":["大乾毒士千古第三阳谋","大乾毒士千古第三阳谋2"],"record_no":null,"actors":[],"tags":["全130集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/7f35ed3afa1b1efcd496bdd1f12cb0ba~tplv-shrink:640:0.image","intro":"大乾毒士，千古第三阳谋！第二季，顶级谋略大师高阳穿越大乾，成了备受鄙夷的落魄纨绔，还惨遭退婚，受尽世人嘲讽。绝境重生，他凭千古诗文惊艳长安，以权谋智术周旋世家权贵、立足诡谲朝堂。他暗中布局、步步崛起，搅动朝野格局。恰逢亲王作乱、藩王叛国引外敌压境，大乾深陷内忧外患。高阳逆势破局，横扫乱世危机，从底层纨绔逆袭登顶，铸就传奇。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7676096047042546750","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10094","standard_title":"觉醒伪神神明弃我我自为神2","aliases":[],"record_no":null,"actors":[],"tags":["全139集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/4dc7137d5a227fb102f0afd8267484e1~tplv-shrink:640:0.image","intro":"神明为尊的夏国以神印品级论高低，被神堂判为神弃之人的陈昊宇偏不认命。他以大比状元入读寒山学院，列车上救下田宝、赠颜莎莎红色神印，硬刚设登天梯勒索新生的学生会长穆松，被五系拒收后进了特殊系。导师司徒与大蟒倾心相授，他血练寒山石、悟天武、战百人，还觉醒了升级神印的禁忌能力。黄沙城任务中，他拒替霍家毒杀供货商商旻，神变魔渊震退群雄，收下八百神印与托孤陈川。神弃我，我便自为神，他的封神路能走多远？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7676383631534722073","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10095","standard_title":"持械入宋第二季","aliases":["持械入宋","持械入宋2"],"record_no":null,"actors":[],"tags":["全100集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/3c22a827be5fb45119ea57e5c9b3d1e7~tplv-shrink:640:0.image","intro":"来自后世的五人小队，在清河村带领一群普通村民打造属于自己的力量。他们凭借现代知识，整合乡勇、重建清河，让这个曾经不起眼的村庄逐渐崛起。随着名声传入秦州，正式踏入大宋舞台，一步步建立自己的根基，大宋注定将不再平凡。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7676706788724460568","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10096","standard_title":"听说我死后成了反派白月光第二季","aliases":["听说我死后成了反派白月光","听说我死后成了反派白月光2"],"record_no":null,"actors":[],"tags":["全141集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/13f2164c5b5ee36fe1233a6c03fa151c~tplv-shrink:640:0.image","intro":"群英会开启，桑念（桑蕴灵）与逍遥宗众人意外卷入秘境。他们打破胜负规则，七人同登魁首；桑念（桑蕴灵）与谢沉舟也在生死相护中确认心意。误入归墟，她发现仙门掩埋五百年的祝余灭族真相，镜弦之死、碧柯的身份与仙魔大战浮出水面。为斩断枷锁，谢沉舟独返修罗殿，一步一叩首。十日归期将至，他却杏无音信，桑念（桑蕴灵）等到的，究竟是归人，还是一场蓄谋已久的杀局？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7676770188406049817","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10097","standard_title":"凡人百世书第六季","aliases":["凡人百世书","凡人百世书6"],"record_no":null,"actors":[],"tags":["全130集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/a9d6fe26e6903381fda147e356d0907b~tplv-shrink:640:0.image","intro":"百世书的轮回修行世界里，陈默误入由韩卿律法镇压的胎海，借时序律闭关，器灵猫胆也融合神虎遗骨。主仆蜕变后，陈默凝成十万丈法相并收服玄龟，由此揭开覆海太子以炼妖炉炼化天骄的阴谋。九人合力冲破洪炉大阵，孟章舍命毁炉。陈默虽化解师尊执念，丫丫却以身封敌，他能否兑现唤醒丫丫、救回故友的誓言？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7677588142009879577","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10098","standard_title":"糯糯下山师兄们都慌了","aliases":[],"record_no":null,"actors":[],"tags":["全63集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/596f73a90e0c4cff2d95ee3b1afd4268~tplv-shrink:640:0.image","intro":"青云剑宗漏雨的山门里，藏着位即将飞升的老神仙，和刚满六岁的关门弟子云糯糯。她背着玄铁重剑、揣着当糖豆的九品神丹，奉师命到修仙界寻回五位师兄。她先在天剑宗闹尽笑话，认回九天仙尊大师兄；又用神丹救下太古吞天犼，一剑劈退万兽门，骑兽硬闯九幽魔界，把众魔跪拜的幽冥帝君当成落魄二师兄心疼。丹道圣人三师兄现身，她才发现师父口中的穷师兄一个比一个显赫，名册上却还剩两个名字，等着她去掀风起浪。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7677801492920667198","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10099","standard_title":"谁说纨绔不能当状元第二季","aliases":["谁说纨绔不能当状元","谁说纨绔不能当状元2"],"record_no":null,"actors":[],"tags":["全316集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/29e3546d2552a1b71bb03212c037db65~tplv-shrink:640:0.image","intro":"江小白奉命接待北虞、齐国使团，与赫连昭月从国子监论比一路斗到皇家园林，逐渐察觉使团真正目的。随后，江家旧人江景轩现身，勾结北虞，以伪造密函诬陷江景承通敌，江小白父子被打入大牢。面对死局，江小白反将计就计，借三万江家兵甲设局翻盘，揭穿江景轩，镇北侯府也因此晋升镇国公府。之后，长公主举办藏锋宴，江小白屡屡出奇制胜，更意外获得武道根基。同时他与萧青修及京城商界势力展开新的较量。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7677874167550594110","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10100","standard_title":"聚宝仙盆之杂灵根才是真BOSS第十季","aliases":["聚宝仙盆之杂灵根才是真BOSS","聚宝仙盆之杂灵根才是真BOSS10"],"record_no":null,"actors":[],"tags":["全199集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/8ffad6c82f7fc13b782ce00a82abcd5c~tplv-shrink:640:0.image","intro":"杂役弟子贺平生一路苦修，终于飞升仙界，面对重重困难与危机，不断苟活、提升、寻求破局之法，最后虽大仇得报、荡平宗门宿敌，却身不由己地被金仙采石强行收为奴仆，被迫深入魔族大墓，在步步惊心的绝境中意外重逢了一位神秘女子。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7677914379060251673","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10101","standard_title":"觉醒伪神神明弃我我自为神3","aliases":[],"record_no":null,"actors":[],"tags":["全120集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/65eb55718b29bf2bf90969e6a6f7cf5b~tplv-shrink:640:0.image","intro":"少年陈昊宇觉醒SSS级伪神天赋，却被神堂判为神弃之人，全校嘲讽、官方打压，幸有全员护短的恶鬼之牙公会兜底。天王关血 090a7f85c015d84d665~tplv-shrink:640:0.image","intro":"顾清棠替婆婆入狱，入狱前，丈夫跪着发誓会照顾好她的母亲和妹妹，永不负她。可出狱当天，她等来的却是一场婚礼——丈夫娶了她最信任的女人，还住着她买的房子、用着她的资产。顾清棠冷笑，既然你们把我给的一切都当成自己的，那我就一样一样，亲手拿回来！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7680515057255451710","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10116","standard_title":"急诊摸鱼王","aliases":[],"record_no":null,"actors":[],"tags":["全116集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/cafa83f45325ece8897fc26f1172d79c~tplv-shrink:640:0.image","intro":"曾经站在世界之巅的外科天才贺知舟，隐姓埋名到急诊科躺平摸鱼。上班睡觉打游戏，病历潦草，被全科室当成废物关系户，主任限期将他开除。可每逢危重症人命垂危，他随手出手便起死回生。只想摆烂度日，奈何全院跪求他出手救人！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7680564528135818302","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10117","standard_title":"持械入宋第四季","aliases":["持械入宋","持械入宋4"],"record_no":null,"actors":[],"tags":["全100集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/44ffcb48211bc47c63545a4928854179~tplv-shrink:640:0.image","intro":"清河势力渐稳，林昭带领五人小队继续扎根，王浩川通过解试，踏上赴京之路；林昭整顿地方事务、发展清河，逐步获得朝廷认可。西北局势再起波澜，五人小队凭借现代科技和智慧化解危机，五人小队由边地一步步走向更大的舞台。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7680845974494776345","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10118","standard_title":"糯糯下山师兄们都慌了第二季","aliases":["糯糯下山师兄们都慌了","糯糯下山师兄们都慌了2"],"record_no":null,"actors":[],"tags":["全93集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/ade67c853a62cd3bfaa579adf5cbaf9e~tplv-shrink:640:0.image","intro":"六岁那年，云糯糯被师父派下山历练，顺便寻找失散多年的五位师兄。她本以为师兄们只是普通修士，生活过得不太好。可随着她一路寻找，才发现大师兄竟是镇压天下的九天仙尊，二师兄是统御九幽的魔界帝君，三师兄是丹道圣人，小奶娃背着一柄破旧黑铁巨剑，带着上古异兽，一路闯荡修仙界，顺手把五位绝世大佬师兄全部喊回了家。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7680883072278989849","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10119","standard_title":"谁让这个文盲修仙的第三季","aliases":["谁让这个文盲修仙的","谁让这个文盲修仙的3"],"record_no":null,"actors":[],"tags":["全121集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/7372fff46f1e1387062fc3d86f51fca0~tplv-shrink:640:0.image","intro":"主角团奔赴圣魔城营救云知意，陈极煽动民愤制造混乱，借机救人，却被困圣魔城大阵。众人历经死战，在夏皇子接应下成功突围，退守轮回宗。陈极改良轮回圣经，隔空捞出夏皇神魂。各大魔宗齐聚镇苍之地，企图破除封印入侵玄天大陆。主角团深夜潜入敌营，绑架多名魔宗圣子、圣女作为筹码。封印破碎、接引之门被毁，魔修围攻轮回宗，众人靠人质数次脱险，逃亡血神府遗迹。绝境之中，寿元将尽的血神老祖现身退敌，赠予众人血神古池传承！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681212396911741976","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10120","standard_title":"穿成野神我靠香火斩诸神2","aliases":[],"record_no":null,"actors":[],"tags":["全88集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/f94a91fc8027f8f1f7ead4d19d86ed1b~tplv-shrink:640:0.image","intro":"穿越成神弃之地一尊无人问津的泥塑野神，唯一的信徒是个六岁孩童。诸神视苍生为蝼蚁，妖魔以人族为血食。而他，从河西村一盏香火起步，踏遍灵域，收妖邪、斩正神、破枷锁。当九重天倾覆，万神陨落如雨那个被神明遗弃的世界，终于等来了属于凡尘的神明。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681235585092029502","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10121","standard_title":"万妖图录传第十二季","aliases":["万妖图录传"],"record_no":null,"actors":[],"tags":["全200集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/335cde75307dedacb0e0978bf8bc3522~tplv-shrink:640:0.image","intro":"大唐长公主姜月初破界飞升，踏入人妖相争的云梦乡。她持有可借斩妖增长道行的金色卷轴，先后在大泽、观澜岛连斩妖将、镇杀观澜仙君，因此被界青宗奉为客卿。仙神洞府现世，姜月初查明大唐本是藏有道画的画卷天地，画境大成须血祭亿万生灵。妖魔屠戮长安，她回援独战云梦天骄，斩杀独角猛虎，将天水麒麟摹影入卷、化棋增力。星宫图录之谜浮出水面，域外大修与妖魔环伺，姜月初立誓以一卷妖图守住大唐生机。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681495327056071704","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10122","standard_title":"清水故事农家夫妻的红火小日子","aliases":[],"record_no":null,"actors":[],"tags":["全108集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/803f29fa1b58e34a67b57bf7376463c2~tplv-shrink:640:0.image","intro":"受尽苛待的沈念弟，为四子林清河冲喜，更名林晚秋。她本以为再入火坑，却在善良和睦的林家收获久违的亲情与尊重。聪慧能干、吃苦耐劳的晚秋，凭手工技艺、山野本事补贴家用，暖心治愈自卑的林清河。她助力大嫂喜得身孕、救下重伤村民，赢得全村敬重。林家众人同心协力，躲过天灾、化解邻里刁难、摆脱糟心家事，一家人勤恳打拼，携手将清贫日子过得愈发红火温暖。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681597391736163390","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10123","standard_title":"重生七零东北悔婚后我打猎致富乡野第三季","aliases":["重生七零东北悔婚后我打猎致富乡野","重生七零东北悔婚后我打猎致富乡野3"],"record_no":null,"actors":[],"tags":["全91集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/7d4a75016429c7041702b91bfe793c5f~tplv-shrink:640:0.image","intro":"李青山重生回到知青下乡年代，主动接纳处境艰难的苏暮鱼成婚。他依靠过人的狩猎天赋进山获取山货，采得百年野参换来积蓄，勤恳务农经营小家，善待双方家人，用心呵护妻子，一家人相互扶持，安稳富足地度过乡村生活，日子稳步向好。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681611323880246334","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10124","standard_title":"聚宝仙盆之杂灵根才是真BOSS第十一季","aliases":["聚宝仙盆之杂灵根才是真BOSS"],"record_no":null,"actors":[],"tags":["全199集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/9dd5a33ea6a781fa91c28374be587ded~tplv-shrink:640:0.image","intro":"杂役弟子贺平生因意外拾得一只聚宝盆，从此逆转宿命，由凡入仙，直上九天，仙界之中，因果如网，他遇上一名梦吃前尘的女子，其身份竟与他未解的过注息息相关，笠门大能以“转世”为由强行夺人，留下的笠光暗藏玄机。魔域深处，上古天帝遗迹开启，头骨如林，法则错乱。聚宝盆的秘密尚未揭晓，被带走的爱人又在何方？这条路的尽头是道还是劫。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681903520873729048","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10125","standard_title":"睡醒三百年养的五只小兽全成妖祖啦","aliases":[],"record_no":null,"actors":[],"tags":["全91集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/754fbea9b86989fae684ec5254f1135f~tplv-shrink:640:0.image","intro":"阿梨一觉睡了三百年，养大的五只小兽尽数离去。她带着五只旧饭碗、十二枚铜钱与一把锈柴刀下山寻兽。昔日的小家伙已成威震四方的妖祖，历经重重相遇与揭秘，阿梨知晓三百年封印的真相，携手五只妖祖，一同对抗祸世灭灵兽神。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7681976201933491224","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10126","standard_title":"谁说纨绔不能当状元第三季","aliases":["谁说纨绔不能当状元","谁说纨绔不能当状元3"],"record_no":null,"actors":[],"tags":["全171集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/f67999fd1a8bf903c91bcf7647622dc8~tplv-shrink:640:0.image","intro":"一瓶被嘲笑成清水的香水，转眼让八大商号争得面红耳赤，江小白不仅拿下京商会长，还把商战主动权牢牢握在手中。面对北虞、齐国使团，他先以三万江家军铺开威势，再用十八门大炮轰碎两国幻想，逼使团祭拜英烈。可萧青修不甘失势，联合一品堂强行逼宫。江小白索性夜调十炮，将天丰酒楼夷为平地！京城风云彻底被他搅翻！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682239041630129214","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10127","standard_title":"谁把我仙侠游戏退出键扣了3D版第二季","aliases":["谁把我仙侠游戏退出键扣了3D版","谁把我仙侠游戏退出键扣了3D版2"],"record_no":null,"actors":[],"tags":["全123集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/477d7e839da5f38e92a6012d3a3cc93c~tplv-shrink:640:0.image","intro":"神霄剑宗众人闯危机四伏的寒潭秘境，秘境被血色矿石污染，妖兽实力暴涨。叶凝霜、何修远等人被分头牵制，嬴怀虚意外落入BOSS老巢，孤身鏖战四头九尾青狐，数次耗尽丹药、依靠复活丹苦战，拼死摧毁秘境。战后嬴怀虚突破至灵海境，发现自身渡劫无天雷，靠抢夺他人劫气完成渡劫，又外出寻访人才、刷秘境攒实力，准备接受师尊传承。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682279241597078552","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10128","standard_title":"西游问道第三季","aliases":["西游问道","西游问道3"],"record_no":null,"actors":[],"tags":["全218集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/1af568c29f02dbb28160cf0b162e3aec~tplv-shrink:640:0.image","intro":"蓝星降临SSS级西游地狱神境，万妖入侵现世，全人类陷入绝望！普通人稍有不慎便沦为大妖口粮，却不知这竟是宁辰的修仙新手村！他熟知剧情，携石猴拜入方寸山，听菩提讲道，以一年道行兑换百倍神级悟性！从反杀虎王到独断混世大魔，他于方寸山悄然证道，更与齐天大圣结下生死至交。当西游大妖肆虐蓝星、众生倒悬，宁辰仗剑踏天，诸位可曾听闻齐天大圣？不才正是其挚交小师弟！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682294717291170840","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10129","standard_title":"逆江湖之苍生为局第三季","aliases":["逆江湖之苍生为局","逆江湖之苍生为局3"],"record_no":null,"actors":[],"tags":["全110集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/ea938ca89938bbdd9259b7647a8ee660~tplv-shrink:640:0.image","intro":"大夏江湖之中，武师与方士争锋不休，妖兽四处横行，皇室和宗门的棋局层层嵌套。顾苍生于问剑大会上硬接南柯三剑，助她悟剑成圣，而后当众示爱。他又将宁清心的噬血旧剑重铸为初阳刀，帮她斩断七百年的剑仇，令其破境九品。妖王隐山君围困呼延城，呼延烈燃圣血战死，顾苍生独自支撑孤城，一人斩杀数万妖兽，杀神之名震动天下。待到四位冥府武圣当众跪拜，顾苍生的少主身世随之公之于众，这场江湖共主之争，方才正式拉开序幕。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682426136021715992","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10130","standard_title":"听说我死后成了反派白月光第四季","aliases":["听说我死后成了反派白月光","听说我死后成了反派白月光4"],"record_no":null,"actors":[],"tags":["全111集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/803fcecf4cd6654f19b2b51218ccfabd~tplv-shrink:640:0.image","intro":"三百年后，桑念（桑蕴灵）重返人间，却失去了往昔记忆。昔日同门早已各奔东西，谢沉舟也成了令两界忌惮的魔尊。蓬莱危局骤起，她与故人接连重逢，也对那个自称医修的陌生青年产生莫名熟悉。她忘了他，却仍会下意识捂热他的手；他等了她三百年，却只敢说“不记得也没关系”。当前尘花唤醒旧日，他们还能否重新走到彼此身边？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682637968472820798","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10131","standard_title":"重生丑小鸭逆袭成了万人迷","aliases":[],"record_no":null,"actors":[],"tags":["全102集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/a316a85007de06165e04feb098bfad41~tplv-shrink:640:0.image","intro":"前世，米珂是万人迷女主宋静伊的炮灰闺蜜。一朝重生，她绑定系统，只要完成任务，就能兑换美貌，挣脱炮灰悲惨命运。米珂行事坦荡，摇身一变，成为津圈的顶级美人。米珂淡然一笑，善良不该只有虚名，这一世，我要为自己活。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682645700781296665","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10132","standard_title":"反派拿捏","aliases":[],"record_no":null,"actors":[],"tags":["全155集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/87ea5f40f25039649bb5c785bd617781~tplv-shrink:640:0.image","intro":"实习医生祁南穿进一本女频小说，成了三年后会被女主折磨致死的同名炮灰反派。为活命，他扔下剪刀疯狂洗白替夏柠柒付清养母的手术费、搬进她隔壁、每天变着法子送早餐。可这个被造过黄谣、一天打三份工的女孩，早已不信任何好意。他一边防着抢功的原著男主，一边在深夜巷口挡在她身前。直到夏柠柒被京城夏家认回、身份彻底逆转的那天，祁南才发现最难改的不是剧情，是自己的心。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682778663716146200","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10133","standard_title":"福星阮现现七零重生记看我搬空全家","aliases":[],"record_no":null,"actors":[],"tags":["全153集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/7764e5575c7872ceebda371c41adca9a~tplv-shrink:640:0.image","intro":"前世，阮现现被偏心的家人夺走工作，被迫替堂妹下乡，最终落入他人算计。再次睁眼，她回到命运转折的那一天，还意外绑定发家致富系统。这一次，她不再忍气吞声该拿的钱一分不少，该算的账一笔不漏。面对装可怜的堂妹、暴躁护短的父亲和精于算计的爷爷，她表面装乖，背后步步布局。从任人牺牲的小可怜，到掌握财富与人生选择权的赢家，阮现现誓要夺回属于自己的一切，让所有轻视她的人追悔莫及。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7682990495462607896","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10134","standard_title":"觉醒伪神神明弃我我自为神4","aliases":[],"record_no":null,"actors":[],"tags":["全152集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/27b6ec3420fc4698dff8df8c004c4264~tplv-shrink:640:0.image","intro":"陈昊宇在赖瞎子指点下炼成半神之手，重返寒山学院后击败曹主任，以强硬实力震慑各校天才。穆松联合各校天才密谋在挑战赛围剿特殊系，陈昊宇拒绝安乔乔的招揽，却为保护同伴与她达成合作，并带回资源助特殊系全员换上红色神印。各方围攻古堡时，司徒独自死守，为学生争取提升时间，陈昊宇因此遭到反噬，幸得霜螭相救转危为安。挑战赛开幕，他率众骑龙强势归来，直面云中岛的围猎。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683036877804293144","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10135","standard_title":"我万古第一第二季","aliases":["我万古第一","我万古第一2"],"record_no":null,"actors":[],"tags":["全86集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/497641e6496ca94d81cb8776f28ab1f4~tplv-shrink:640:0.image","intro":"七大圣地眼中的废材，竟亲手毁掉了万古罕见的根基——只因他觉得，还不够完美。十次散功，十次重修，陈长生将失传仙法一一修成，让当年看轻他的强者悔断肠。可天帝宝库之外，一场血祭正在撕开界门。祭天教跪迎的“真神”，竟是来猎杀天骄、掠夺本源的屠夫！宗门内变，大阵崩塌，七龙命悬一线。唯一的生机，却在万里之外的黑潮深处——那个总嫌自己不够强的少年，正要点燃第十轮太阳。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683089448619232280","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10136","standard_title":" 内部，抵御外敌。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683455900727659545","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10140","standard_title":"事无两样人心别","aliases":[],"record_no":null,"actors":[],"tags":["全113集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/17607d2248fa68b7350652de7ee9dbf5~tplv-shrink:640:0.image","intro":"林飒为爱步入婚姻，身为顶尖设计师却甘愿回归家庭。坐月子期间，丈夫傅砚辞一心照料兄弟之妻苏雨柔，屡屡忽视她与刚出生的女儿。一次次的偏心与伤害耗尽她所有感情，林飒幡然醒悟，毅然提出离婚，递交离职报告，收回自己的设计心血。她挣脱破碎婚姻枷锁，反击傅家与苏雨柔，夺回事业主动权，为自己和女儿争取崭新的人生。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683471379894651928","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10141","standard_title":"替弟顶罪五年归来已是天策战神","aliases":[],"record_no":null,"actors":[],"tags":["全117集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/0f0b2e3cf5d1225434bd83cc5bad41e0~tplv-shrink:640:0.image","intro":"五年前，林铭为救弟弟林毅替罪流放北疆，却意外觉醒荒古圣体与杀敌爆修为系统，在尸山血海中成长为大夏无敌的天策上将。五年后归来，等他的却是父母毁诺、弟弟夺位，更抢走他的未婚妻。心死的林铭与王府恩断义绝，并在婚礼上以留影石揭开当年真相。随着隐藏身份与逆天实力层层曝光，昔日弃子从皇城一路杀入百朝大战，横压各朝天骄——而曾经轻视、背叛他的人，只能亲眼看着他登顶天下！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683548689662479385","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10142","standard_title":"傻女重生记睁眼后盖房发家第四季","aliases":["傻女重生记睁眼后盖房发家","傻女重生记睁眼后盖房发家4"],"record_no":null,"actors":[],"tags":["全201集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/6fe3ff94b1b7a7be1101a10f7ce381b9~tplv-shrink:640:0.image","intro":"聪慧通透的李穗儿靠着开荒种地、经营面馆攒下家底，日子眼看着红火，饥荒寒冬步步逼近，难民汹涌而至。李穗儿与程风，既要护住家庭，又要周旋于阴谋与民间疾苦。突如其来的刺杀紧逼，为了拿到罪证，即将上演啼笑皆非的男扮女装冒险行动，李穗儿和程风，能识破层层伪装，保全万千难民，揪出幕后真正的恶人吗？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683748128125635646","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10143","standard_title":"山野大佬七零真千金飒爆了","aliases":[],"record_no":null,"actors":[],"tags":["全161集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/600f9ebcb1bfc0a6711870bca6f6f864~tplv-shrink:640:0.image","intro":"特工苏苗苗穿越到七十年代，成为霍家失散多年的真千金。刚认亲，全家便要下放贫困乡村。面对困境，她凭借空间异能与精湛针灸医术，直面艰苦生活。在石码头村，苏苗苗救下遇险村民，协助赤脚医生行医，还教孩子们辨识草药，带领乡亲们采挖药材创收，帮全村解决过冬难题。她以善良和担当收获村民敬重，守护霍家一家人，在逆境中脚踏实地，用双手奋斗改写自己与乡村的命运。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7683817709909314585","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10144","standard_title":"摸物逆袭重生追回我妻女","aliases":[],"record_no":null,"actors":[],"tags":["全60集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/c8baec49125293b1b7108ce5936524ea~tplv-shrink:640:0.image","intro":"历经彻骨悔恨猛然觉醒，我痛改前非，获得触摸物品就能窥见过往未来的异能。火海之中救下命悬一线的妻子林晚星，面对妻子的失望、讨债人的逼迫，我放下身段收废品捡漏求财。历经误会与考验，我凭本事翻身，对抗各路刁难，努力赢回妻女的信任。浪子回头，用行动弥补过往亏欠，守护属于自己的温暖小家。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7684228987538656318","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10145","standard_title":"蒙冤二十五年归来举世皆惊","aliases":[],"record_no":null,"actors":[],"tags":["全70集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/8c444fb5e6f34ea7c67354e3aa716364~tplv-shrink:640:0.image","intro":"普通打工人陈志远即将和相恋多年的女友林倩订婚，消失二十五年的父亲陈国栋终于归来。没人知道，所谓消失，只是绝密科研项目身份的掩护。订婚宴风云突变，林倩及其父母得知陈国栋经历，心生嫌弃。陈志远不愿家人受辱，毅然选择退婚。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7684559889913351193","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10146","standard_title":"穿越古代我靠军火建立王朝第二季","aliases":["穿越古代我靠军火建立王朝","穿越古代我靠军火建立王朝2"],"record_no":null,"actors":[],"tags":["全91集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/272d21854290ae0755e32561b9326823~tplv-shrink:640:0.image","intro":"陈楠穿越古代，凭借随身空间与现代装备在黑石崖站稳脚跟，更组建起纪律严明的陈家军。面对武定侯围剿、地方豪强横行、云州都督暗中设局，他一路破敌夺城、惩恶伸冤，也逐渐建立起属于自己的秩序。与此同时，大梁名将纪寒钧率五千玄甲铁骑压境，大乾血脉之谜随之浮出水面。当前朝旧局 ll,"actors":[],"tags":["全1000集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/6be6de7b80ddc5cb6df225902f3d5823~tplv-shrink:640:0.image","intro":"本季1000集！陆蘅与祁妙的三搭剧。秦朗不过是出个差的功夫，因为好奇心过重凑了个热闹，不小心被砸重，穿到了古代。他还没反应过来，怀里就被塞了个刚出生的孩子，说是他的女儿，还是第五个孩子，秦朗一脸的懵，这就当爹了？再环顾一下家里，家徒四壁，四处漏风，父母偏心，妻女嗷嗷待哺，真是天崩开局。为了让自己的五个小棉袄过上好日子，秦朗只能连夜搞事业。拉拢兄弟，洗脑偏心父母，对抗大哥大嫂，美食科举，真实小日常。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688646466708966462","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10210","standard_title":"穿成野神我靠香火斩诸神第5季","aliases":["穿成野神我靠香火斩诸神","穿成野神我靠香火斩诸神5"],"record_no":null,"actors":[],"tags":["全118集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/f94a91fc8027f8f1f7ead4d19d86ed1b~tplv-shrink:640:0.image","intro":"他穿越成神弃之地一尊无人问津的泥塑野神，唯一的信徒是个六岁孩童。诸神视苍生为蝼蚁，妖魔以人族为血食。而他，从河西村一盏香火起步，踏遍灵域，收妖邪、斩正神、破枷锁。当九重天倾覆，万神陨落如雨那个被神明遗弃的世界，终于等来了属于凡尘的神明。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688649542585044030","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10211","standard_title":"天道余途苍途问道","aliases":[],"record_no":null,"actors":[],"tags":["全1000集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/d3bbd221487dca64e19d27a1727e0f58~tplv-shrink:640:0.image","intro":"天道倾颓，残道留世，是为天道余途。少年余羡生于凡村，机缘踏上仙路，拜入白云宗。闯试炼，访诸宗，探上古遗迹，层层揭开天道崩毁的尘封秘辛。仙途劫难重重，诱惑丛生，他不逐虚妄长生，凭一己凡躯，于残存天道轨迹间求索，守道心，踏一条无人敢行的苍茫长路。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688651092246154264","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10212","standard_title":"穿越六零之我在山洞闷声发家","aliases":[],"record_no":null,"actors":[],"tags":["全157集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/65a4cd5682095c7eeeec82a0c9c172a6~tplv-shrink:640:0.image","intro":"现代特种兵魂穿物资匮乏的年代，成为受尽原生家庭苛待的秦天。被锁柴房濒死之际，觉醒灵田空间，手握灵泉沃土。他当众撕破家人的虚伪面目，立下文书果断断亲，搬去山脚荒洞自立门户。凭借空间加持，进山狩猎、种植作物，辗转置换物资，抓住机遇获得采购身份。途中结识善良温柔的沈熙，互相扶持，一边化解邻里风波，一边努力建房安家。秦天靠双手一步步积累，挣脱苦难过往，在艰苦岁月里，奋斗出属于自己的温暖小家。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688666572499471422","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10213","standard_title":"拆迁一千万我装穷试三子","aliases":[],"record_no":null,"actors":[],"tags":["全87集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/9f32d2722ba664a593cd819dee4fb606~tplv-shrink:640:0.image","intro":"守寡多年的农村母亲赵桂兰，含辛茹苦将三个儿子养大。五十五岁生日这天，她得知老宅和十亩地被征收，可获一千万补偿及两套安置房。多年疏远的大儿媳突然大办寿宴，令她意识到，钱正在试探亲情。为看清三个儿子的真心，赵桂兰请工作人员放出“老宅违建、一分不赔”的假消息，先后走进三个儿子的生活。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688680481499384894","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10214","standard_title":"妹妹抢错郎我却嫁兵王","aliases":[],"record_no":null,"actors":[],"tags":["全155集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/238e4e4169f7610d3be4afb54fefae04~tplv-shrink:640:0.image","intro":"苏雪重生后认定姐姐苏婉抢走前世富贵，执意悔婚霍家，转嫁穷书生许修之。苏婉早知许修之伪善狠毒，顺势接下霍家亲事，嫁给军中小旗霍石安。一个机关算尽奔向旧梦，一个清醒改命守住良缘。换亲之后，姐妹命运从此逆转，兵王归来，真相与报应一并降临，全剧爽感拉满。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688695977443593278","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10215","standard_title":"八零秋词","aliases":[],"record_no":null,"actors":[],"tags":["全150集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/d5882c9dcf233e9ea1b6ab8d8de0c4af~tplv-shrink:640:0.image","intro":"八零年代，姜宁从一场满是遗憾的过往里归来，赶在婚约敲定之前，主动退掉与天之骄子宋明远的姻缘。她甘愿放下儿女情长，以宋家干女儿的身份立足世间，入职京大图书馆，凭一手好字与学识谋求属于自己的人生。昔日纠缠的两人变为屋檐下的兄妹，当她步步向外奔赴新生，那个曾经轻视她的少年，心绪却悄然失控，命运的棋局悄然反转。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688716029802859544","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10216","standard_title":"一道划痕满城风雨","aliases":[],"record_no":null,"actors":[],"tags":["全51集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/109585a7efc22a371ea0ae7a6dcdb254~tplv-shrink:640:0.image","intro":"沈知微赶到京海相亲，没想到人还没见上，就先在高氏集团门口惹上麻烦。高世杰的秘书柳如烟抢车位撞了她，却反过来索要千万赔偿。高世杰不问缘由，只凭沈知微朴素的穿着和一辆国产车，便认定她配不上自己。面对两人的步步紧逼，沈知微始终没有慌。直到约定的时间一到，十几辆运钞车突然驶入停车场，一个亿现金真的送到了现场，事情也开始彻底失控。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688740767782669374","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10217","standard_title":"景城深处梨花开","aliases":[],"record_no":null,"actors":[],"tags":["全150集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/8ed011ee59d3b8653f9d2673cb9c49dd~tplv-shrink:640:0.image","intro":"姜羡梨重回1987年，识破姜羡蕙与吴建霆的背叛，面对感情与家庭的骤变，她果断另选道路，嫁入谢家。外人眼中不堪的丈夫谢景城，实则能力出众，对她真诚体贴。她一边求学、置业、帮助亲人，一边在复杂家庭中站稳脚跟，也渐渐看清身边人的真心与假意。多年后，母亲临终前忽然望向门外，说看见已故亲人来接她。姜羡梨心头一震，难道这一切，并不只是命运重来那么简单？","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688751589397384254","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10218","standard_title":"悔悟我用余生偿前错第二季","aliases":["悔悟我用余生偿前错","悔悟我用余生偿前错2"],"record_no":null,"actors":[],"tags":["全223集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/3dfa8d827cdf228f3e16e31d27aceae9~tplv-shrink:640:0.image","intro":"带着上一世的遗憾重生到80年代的陈铭，发现他瘸了一辈子的腿还有的治。愧对的爱人，亲人，还有机会弥补！曾经的他，胆小，懒惰，怕事！身为村长家的上门女婿，妻子也是貌美如花，可是他却不懂得珍惜！这一世重生，他主动扛起了猎枪，等于扛起了父亲的责任，丈夫的担当！他穿梭在林海雪原！叫熊仓子，抠猪獾子，驱虎杀狼，斗金雕，带着猎狗驰骋山林！冬日打猎，夏挖参，守着大兴安岭山脉的群山资源，他发家致富！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7688947957093108760","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10219","standard_title":"囤货逆袭大佬末世之归途第二季","aliases":["囤货逆袭大佬末世之归途","囤货逆袭大佬末世之归途2"],"record_no":null,"actors":[],"tags":["全176集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/4f074f75ce5559119d33e83bd14b9b83~tplv-shrink:640:0.image","intro":"末日降临后丧尸横行、异兽四起，身负多重异能与神秘空间的楚悦带着队友一路斩杀巨蟒、突破重重阻碍，历经险阻护送队友与家人团聚。然而当她满心欢喜回到家中，却发现父母早已为了寻找她而踏入末世险途。为了寻回双亲，楚悦毅然独自重返危险绝域。面对天降怪雨、山体滑坡与致命变异体，她不仅收服变异大熊猫为战宠，更在废墟中偶遇昔日教官与医学泰斗。在这残酷乱世中，凭借雷电之力与空间神器破开杀局，誓要跨越万里寻得一家团圆。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689037633099402264","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10220","standard_title":"西游问道第五季","aliases":["西游问道","西游问道5"],"record_no":null,"actors":[],"tags":["全239集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/8979c0eecab68492dd765b68e9130c96~tplv-shrink:640:0.image","intro":"蓝星降临SSS级西游地狱神境，万妖入侵现世，全人类陷入绝望！普通人稍有不慎便沦为大妖口粮，却不知这竟是宁辰的修仙新手村！他熟知剧情，携石猴拜入方寸山，听菩提讲道，以一年道行兑换百倍神级悟性！从反杀虎王到独断混世大魔，他于方寸山悄然证道，更与齐天大圣结下生死至交。当西游大妖肆虐蓝星、众生倒悬，宁辰仗剑踏天，诸位可曾听闻齐天大圣？不才正是其挚交小师弟！","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689045379286830104","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10221","standard_title":"灵犬报恩被抛弃后赶山护妻女","aliases":[],"record_no":null,"actors":[],"tags":["全76集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/7a775ea20ee76a6a93acfcc8bc0e2413~tplv-shrink:640:0.image","intro":"猎户陈凡染上肺痨后失去打猎能力，曾靠他养活的大哥陈朝阳一家非但没有感恩，反而为了省下口粮将重病的他推下后山瀑布，还准备把妻子林晚晚和五岁女儿丫丫卖掉换钱。命悬一线之际，三年前被陈凡从捕兽夹下救过的黑犬“大黑”突然出现，拼死从狼口中救下主人。最终从一个被亲人抛弃的病弱猎户，成长为全村信服的主心骨，带着妻女、灵犬和乡亲们熬过灾荒，真正把大山变成了世代吃不完的聚宝盆。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689113403779992638","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10222","standard_title":"临夏的陆凛第三季","aliases":["临夏的陆凛","临夏的陆凛3"],"record_no":null,"actors":[],"tags":["全101集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/3cd33b9b1627a10b43c224847fd20a72~tplv-shrink:640:0.image","intro":"江临夏随母改嫁进大院，所有人都等着看这对乡下母女的笑话。一个心灰意冷的陆凛，一个处处防备的顾小北，还有一群天天上门找事的亲戚。江临夏偏不认命，银针救人，考学逆袭，护母亲，撑新家，硬是把一手烂牌打成王炸。直到那个所有人都说再也站不起来的男人重新站起，她才发现，自己改变的不只是一个人的命运，也悄悄改变了这个家的所有人。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689114947405499454","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10223","standard_title":"余生从容","aliases":[],"record_no":null,"actors":[],"tags":["全80集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/2f4d446c3bc2bca2e98ad4c3dc87c9a0~tplv-shrink:640:0.image","intro":"陈慧兰丧偶后，被儿子林强一家及儿媳娘家六口人霸占养老房三年，沦为免费保姆，甚至遭受殴打。忍无可忍的她，决绝卖掉房子，断然离开。在闺蜜王秀琴支持下，她用法律手段追讨赡养费，为自己讨回公道。失去房子的张家人分崩离析，林强在困顿中幡然醒悟，远赴非洲打拼。两年后，他带着悔改与积蓄归来，而陈慧兰已在新居中重获自由与尊严，开启属于自己的晚年生活。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689145890790984728","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10224","standard_title":"我合成了全世界第1季","aliases":["我合成了全世界","我合成了全世界1"],"record_no":null,"actors":[],"tags":["全315集"],"is_ai_drama":false,"cover_url":"https://p6-novel.byteimg.com/novel-pic/6e92f1530a5949623015e5539022f1b1~tplv-shrink:640:0.image","intro":"第二纪元文明覆灭之后，地球被遗弃，变成银河系规模最大的星际科技垃圾场，堆积着五万亿吨来自各个外星文明、上古纪元的废弃机械、装备与科技残骸。主角程乞婴儿时期被弃在地球垃圾山上，一名拾荒者捡到时随身携带着一个手腕，该手腕简称STC，有万物合成能力，只要找到同类相似科技造物，就可以将两件物品融合，迭代升级成更高级的装备、机械、能源装置。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689289660794670105","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10225","standard_title":"怒海扬帆潜龙出渊","aliases":[],"record_no":null,"actors":[],"tags":["全200集"],"is_ai_drama":false,"cover_url":"https://p3-novel.byteimg.com/novel-pic/972949fdfb6908fb83191ced9222ef76~tplv-shrink:640:0.image","intro":"渔民苏明与兄弟赵强出海捕到价值两百万的顶级海货，即将靠这笔钱提亲，却遭赵强与徒弟顾念联手背叛，被割断安全绳抛入大海。濒死之际他救下被困锁龙网的龙族公主敖灵，得到龙女相助死里逃生。苏明手握云海大酒店供货合同，一边对抗赵强的处处打压，驰骋深海捕捞珍稀海产，一边寻找失踪渔民林海山的踪迹，周旋于各方势力，在怒海之上开启属于自己的逆袭传奇。","platform_links":[{"platform":"红果短剧","h5_url":"https://hongguoduanju.com/detail?series_id=7689379354006015001","scheme":null,"valid":true}],"updated_at":"2026-11-21"},{"id":"dr_10226","standard_title":"以爱为约总裁的合约丈夫","aliases":[],"record_no":null,"actors":[],"tags":["全80集"],"is_ai_drama":false,"cover   function norm(s) { return String(s == null ? '' : s).toLowerCase().trim(); }
  function subseqScore(text, q) {
    // 子序列模糊匹配：连续命中得分更高，用于错别字/省略容错
    text = norm(text); q = norm(q);
    if (!q) return 0;
    if (text === q) return 100;
    if (text.indexOf(q) >= 0) return 80;
    var ti = 0, hits = 0, streak = 0, best = 0;
    for (var qi = 0; qi < q.length; qi++) {
      var found = false;
      while (ti < text.length) {
        if (text[ti] === q[qi]) { found = true; streak++; best = Math.max(best, streak); hits++; ti++; break; }
        streak = 0; ti++;
      }
      if (!found) return 0;
    }
    return Math.round((hits / q.length) * 40 + best * 2);
  }
  function fallbackScore(drama, q) {
    var s = 0;
    s += subseqScore(drama.standard_title, q) * 1.5;
    for (var i = 0; i < (drama.aliases || []).length; i++) {
      s = Math.max(s, subseqScore(drama.aliases[i], q) * 2.0);
    }
    for (var j = 0; j < (drama.actors || []).length; j++) {
      s = Math.max(s, subseqScore(drama.actors[j], q) * 0.8);
    }
    s += subseqScore(drama.intro || '', q) * 0.3;
    for (var k = 0; k < (drama.tags || []).length; k++) {
      s = Math.max(s, subseqScore(drama.tags[k], q) * 0.3);
    }
    return s;
  }

  function normalizePayload(payload) {

    var meta = state.data.meta || {};
    var html = '';
    if (meta.is_sample) {
      html += '<div class="banner banner-warn">⚠️ 当前为<strong>演示数据</strong>：链接均为占位地址且未检测（valid=null），不可用于真实跳转。真实数据请用 <code>python3 crawl_hongguo.py</code> 生成。</div>';
    }
    if (meta.link_valid_note && !meta.is_sample) {
      html += '<div class="banner banner-info">' + esc(meta.link_valid_note) + '</div>';
    }
    $('banners').innerHTML = html;
  }

  function renderFilters() {
    var html = '<div class="chip' + (state.platform === '__all__' ? ' active' : '') + '" data-plat="__all__">全部平台</div>';
    state.platforms.forEach(function (p) {
      html += '<div class="chip' + (state.platform === p ? ' active' : '') + '" data-plat="' + escAttr(p) + '">' + esc(p) + '</div>';
    });
    $('filters').innerHTML = html;
    Array.prototype.forEach.call($('filters').children, function (chip) {
      chip.addEventListener('click', function () { state.platform = chip.dataset.plat; renderFilters(); render(); });
    });
  }

  function renderMeta() {
    var meta = state.data.meta || {};
    $('metaInfo').textContent = '共 ' + state.dramas.length + ' 部剧目 · ' + ((meta.normalize && meta.normalize.alias_count) || '—') + ' 个别名 · 检索引擎 ' + (state.useFuse ? 'Fuse.js' : '内置');
    $('footerCount').textContent = state.dramas.length + ' 部剧目';
    $('genTime').textContent = meta.generated_at || '—';
  }

  function renderSite() {
    // 优先级：索引文件里的站点配置（Cloudflare 托管版 index.html fetch drama_index.json 拿到）
    // > 页面内联配置（build_frontend 生成的自包含 search.html 用）。
    var metaSite = (state.data && state.data.meta && state.data.meta.site) || null;
    var cfg = metaSite || (typeof __SITE_CONFIG__ !== 'undefined' ? __SITE_CONFIG__ : null) || window.__SITE_CONFIG__ || {};
    var links = cfg.links || {};
    if ($('footDesc')) $('footDesc').innerHTML = '本站为<strong>' + esc(cfg.site_name || '短剧别名检索') + '</strong>，仅收录剧目元信息与官方跳转链接，不存储、不提供任何音视频播放。版权归对应平台所有。';
    if ($('footEmail')) {
      var mail = cfg.complaint_email || '';
      $('footEmail').textContent = mail;
      $('footEmail').href = 'mailto:' + mail;
    }
    if ($('footLegal')) {
      var icp = cfg.icp_no || '';
      var needFill = /NEED_FILL/.test(icp);
      $('footLegal').innerHTML =
        (needFill ? '⚠️ 备案号未填写，上线前请编辑 site.json — ' : '') +
        (needFill ? esc(icp) : '<a href="' + escAttr(cfg.icp_link || '#') + '" target="_blank" rel="noopener">' + esc(icp) + '</a>') +
        ' · <a href="' + escAttr(links.privacy || 'privacy.html') + '">隐私政策</a>' +
        ' · <a href="' + escAttr(links.copyright || 'privacy.html#copyright') + '">版权声明</a>' +
        ' · <a href="' + escAttr(links.takedown || 'privacy.html#takedown') + '">侵权处理</a>';
    }
  }

  function doSearch(q) {
    if (!q) return state.dramas.map(function (d) { return { item: d, score: 0 }; });
    var qn = norm(q);
    if (state.useFuse) {
      return state.fuse.search(q).map(function (r) { return { item: r.item, score: 1 - (r.score || 0) }; });
    }
    // 内置搜索：同时支持别名池反查（错别字 -> 标准剧名）
    var aliasTargets = {};
    Object.keys(state.aliasMap).forEach(function (k) {
      if (k.indexOf(qn) >= 0 || subseqScore(k, qn) > 20) {
        Object.keys(state.aliasMap[k]).forEach(function (t) { aliasTargets[t] = true; });
      }
    });
    return state.dramas.map(function (d) {
      var s = fallbackScore(d, qn);
      if (aliasTargets[d.standard_title]) s += 90;
      return { item: d, score: s };
    }).filter(function (r) { return r.score > 0; })
      .sort(function (a, b) { return b.score - a.score; });
  }

  function render() {
    var results = doSearch(state.query);
    if (state.platform !== '__all__') {
      results = results.filter(function (r) {
        return r.item.platform_links.some(function (l) { return l.platform === state.platform; });
      });
    }
    if (!results.length) {
      $('results').innerHTML = '<div class="empty"><div class="big">🔍</div><div>' +
        (state.query ? '没有找到「' + esc(state.query) + '」相关的剧目，换个别名或关键词试试' : '暂无剧目数据') + '</div></div>';
      return;
    }
    var html = results.map(function (r) { return cardHtml(r.item); }).join('');
    $('results').innerHTML = html;
    bindCardEvents();
  }

  function coverHtml(d) {
    if (d.cover_url && /^https?:\/\//.test(d.cover_url)) {
      return '<img class="cover" src="' + escAttr(d.cover_url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
             '<div class="cover-fallback" style="display:none">' + esc((d.standard_title || '剧')[0]) + '</div>';
    }
    return '<div class="cover-fallback">' + esc((d.standard_title || '剧')[0]) + '</div>';
  }

  function cardHtml(d) {
    var html = '<article class="card"><div class="card-head">' + coverHtml(d) + '<div class="card-main">';
    html += '<div class="title-row"><span class="title">' + esc(d.standard_title) + '</span>';
    if (d.is_ai_drama) html += '<span class="ai-badge">AI短剧</span>';
    if (d.record_no) html += '<span class="record-no">备案 ' + esc(d.record_no) + '</span>';
    html += '</div>';
    if (d.intro) html += '<div class="intro" title="' + escAttr(d.intro) + '">' + esc(d.intro) + '</div>';
    if (d.aliases.length) {
      html += '<div class="aliases">' + d.aliases.map(function (a) {
        var type = (state.data.aliasMap[norm(a)] ? '' : '');
        return '<span class="alias' + type + '">' + esc(a) + '</span>';
      }).join('') + '</div>';
    }
    if (d.tags.length) {
      html += '<div class="tags">' + d.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    html += '</div></div><div class="card-foot">';
    if (d.actors.length) html += '<span class="actors">主演：' + esc(d.actors.join(' / ')) + '</span>';

    var usable = d.platform_links.filter(function (l) { return l.valid === true && /^https?:\/\//.test(l.h5_url); });
    if (usable.length) {
      usable.forEach(function (l) {
        html += '<button class="btn btn-primary" data-url="' + escAttr(l.h5_url) + '" data-scheme="' + escAttr(l.scheme || '') + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          esc(l.platform) + '</button>';
      });
    } else {
      html += '<span class="no-link">暂无可用跳转链接</span>';
    }
    html += '</div></article>';
    return html;
  }

  function bindCardEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('.btn[data-url]'), function (btn) {
      btn.addEventListener('click', function () { openLink(btn.dataset.url, btn.dataset.scheme); });
    });
  }

  // ===== 跳转：移动端优先 Scheme，超时降级 H5，保留显式按钮兜底 =====
  function openLink(h5, scheme) {
    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if (!isMobile || !scheme) { window.open(h5, '_blank', 'noopener'); return; }
    var start = Date.now();
    var hidden = false;
    var onVis = function () { if (document.hidden) hidden = true; };
    document.addEventListener('visibilitychange', onVis);
    try {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = scheme;
      document.body.appendChild(iframe);
      setTimeout(function () { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 3000);
    } catch (e) { /* 唤起失败走超时降级 */ }
    setTimeout(function () {
      document.removeEventListener('visibilitychange', onVis);
      if (!hidden && document.visibilityState === 'visible' && Date.now() - start < 2500) {
        window.open(h5, '_blank', 'noopener');
      }
    }, 1800);
  }

  // ===== 工具 =====
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function escAttr(s) { return esc(s); }

  // ===== 事件 =====
  var debounce;
  $('q').addEventListener('input', function (e) {
    state.query = e.target.value;
    $('clear').style.display = state.query ? 'block' : 'none';
    clearTimeout(debounce);
    debounce = setTimeout(render, 120);
  });
  $('clear').addEventListener('click', function () { $('q').value = ''; state.query = ''; $('clear').style.display = 'none'; render(); $('q').focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('clear').click(); }
  });

  // ===== 启动 =====
  loadData().then(function (payload) {
    if (payload) init(payload);
    // Fuse.js CDN 为增强，异步加载；加载完成后重建索引并刷新
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js';
    s.onload = function () { if (state.data && !state.useFuse) { initSearch(); renderMeta(); render(); } };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
